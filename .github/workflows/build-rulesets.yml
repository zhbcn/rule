name: Build and Publish Rule-Sets

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-rulesets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ruleset
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Mihomo binary
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r --arg tag "$TAG" '
            (.assets[] | select(.name == "mihomo-linux-amd64-compatible-\($tag).gz") | .browser_download_url),
            (.assets[] | select(.name == "mihomo-linux-amd64-\($tag).gz") | .browser_download_url)
          ' | head -n 1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Failed to locate mihomo linux-amd64 release asset for $TAG" >&2
            exit 1
          fi
          echo "Downloading Mihomo $TAG from $DOWNLOAD_URL"
          curl -fsSL "$DOWNLOAD_URL" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Run rule-set regression tests
        run: node --test scripts/test.mjs

      - name: Build Mihomo (.mrs/.list) and Egern (.yaml) rule-sets
        run: node scripts/build.mjs --mihomo ./mihomo

      - name: Verify generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Generated files ==="
          find dist -type f | sort
          test -s dist/egern/custom-finance.yaml
          test -s dist/egern/custom-public.yaml
          test -s dist/meta/domain/custom-finance.mrs
          test -s dist/meta/domain/custom-public.mrs

      - name: Publish dist/ to orphan ruleset branch
        shell: bash
        run: |
          set -euo pipefail
          SRC_SHA=$(git rev-parse --short HEAD)
          cd dist
          git init -b ruleset
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ruleset): build from main@${SRC_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin ruleset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
